<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>404 - Page Not Found | Click & Fix Technologies</title>
  
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Bootstrap 5 CSS CDN (Independent) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- Bootstrap Icons CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <style>
    /* Absolute Styling to prevent blank page issues */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif !important;
    }

    body {
      background-color: #f8f9fa !important;
      color: #212529 !important;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      padding: 20px 0;
      border-bottom: 1px solid #dee2e6;
      background: #ffffff;
    }

    .error-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .error-code {
      font-size: 110px;
      font-weight: 800;
      color: #0d6efd;
      line-height: 1;
      margin-bottom: 15px;
    }

    .error-title {
      font-size: 26px;
      font-weight: 600;
      color: #343a40;
      margin-bottom: 15px;
    }

    .error-text {
      color: #6c757d;
      font-size: 15px;
      margin-bottom: 25px;
    }

    footer {
      padding: 20px 0;
      text-align: center;
      background: #ffffff;
      border-top: 1px solid #dee2e6;
      font-size: 14px;
      color: #6c757d;
    }
  </style>
</head>

<body>

  <!-- Header -->
  <header>
    <div class="container d-flex align-items-center justify-content-between">
      <a href="index.html" class="text-decoration-none">
        <h1 class="m-0 fs-4 fw-bold text-dark">Click & Fix Technologies</h1>
      </a>
      <a href="index.html" class="btn btn-outline-primary btn-sm rounded-pill px-3">Home</a>
    </div>
  </header>

  <!-- Main Error Section -->
  <main class="error-container">
    <div class="container">
      <div class="row justify-content-center text-center">
        <div class="col-lg-6">
          <div class="mb-3 text-primary" style="font-size: 60px;">
            <i class="bi bi-exclamation-octagon"></i>
          </div>
          
          <h1 class="error-code">404</h1>
          <h2 class="error-title">Page Not Found</h2>
          <p class="error-text">
            Sorry, the page you are looking for might have been removed, had its name changed, or is temporarily unavailable.
          </p>
          
          <div>
            <a href="index.html" class="btn btn-primary rounded-pill px-4 py-2">Back to Home</a>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer>
    <div class="container">
      <p class="mb-0">&copy; 2026 <strong>Click & Fix Technologies</strong>. All Rights Reserved.</p>
    </div>
  </footer>

  <!-- Bootstrap JS Bundle CDN -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
